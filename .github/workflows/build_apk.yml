name: Build JARVIS Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/build_apk.yml"
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android build files and preserve JARVIS files
        working-directory: android_app
        run: |
          cp pubspec.yaml /tmp/jarvis_pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/jarvis_AndroidManifest.xml
          cp -r lib /tmp/jarvis_lib
          flutter create . --platforms=android --org com.jarvis.assistant --project-name jarvis_android
          cp /tmp/jarvis_pubspec.yaml pubspec.yaml
          cp /tmp/jarvis_AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf lib && cp -r /tmp/jarvis_lib lib
          rm -rf test
          python3 - <<'EOF'
          from pathlib import Path

          for rel in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(rel)
              if p.exists():
                  text = p.read_text(encoding="utf-8")
                  text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                  text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  p.write_text(text, encoding="utf-8")
          EOF

      - name: Install Flutter packages
        working-directory: android_app
        run: flutter pub get

      - name: Run Flutter analyzer
        working-directory: android_app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk